[project]
name = "is4000-advisory-agent-lab"
version = "0.1.0"
description = "IS4000 advisory agents lab - contracts and storage slice (PR1). Independent of the team's backend/app."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisory_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
