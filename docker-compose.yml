services:
  postgres:
    image: pgvector/pgvector:pg16  # postgres:16 + pgvector extension for semantic note search
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fin_ai_agents
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # .env supplies GROQ_API_KEY/TAVILY_API_KEY/FRED_API_KEY/LANGFUSE_* - DATABASE_URL is
    # overridden below since "localhost" means something different inside
    # the container network (it'd point at the backend container itself,
    # not the postgres one).
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fin_ai_agents
      # client profiling agent uses LM Studio on the host (not reachable as localhost from inside the container)
      CLIENT_PROFILING_LLM_URL: ${CLIENT_PROFILING_LLM_URL:-http://host.docker.internal:1234/v1}
    ports:
      - "8000:8000"
    volumes:
      # also persists market researcher run outputs (backend/data/market_research)
      - ./backend:/app
      # the CIO house view PDF that citations such as HV-2026-08-p18 open (served by /agents/product-recommender/house-view/document)
      - ./house_views:/house_views:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
