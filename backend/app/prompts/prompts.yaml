# Central store of every agent prompt in this project, versioned.
#
# Agents call app.prompts.prompt_builder.get_prompt("agent.key") instead of
# hardcoding prompt text, so changing a prompt is a reviewable YAML diff
# rather than a code diff. Each key has a `latest` pointer used by default;
# override a specific key's version via the PROMPT_VERSION_OVERRIDES env var
# (a JSON object, e.g. '{"general.system": "v1"}') for a rollback or an A/B
# test without touching code.
#
# When adding a new version, keep the old one in `versions` (don't delete
# it) and just move `latest` forward - that's what makes this "versioned"
# rather than just "externalized".

shared:
  regenerate_note:
    latest: v1
    versions:
      v1:
        template: |
          Note: your previous response to this same question was rejected by quality review for this reason: {feedback}. Produce an improved response that addresses this.

  client_context:
    latest: v2
    versions:
      v1:
        template: |
          Workspace context for this turn, supplied by the Geneva adviser workspace (not typed by the user): {details}. Use it to tailor the answer to this adviser and client. You do not have the client's IPS, holdings, meeting notes or portfolio data; if the question needs them, say so and suggest checking the client's documents in the workspace instead of guessing.
      v2:
        template: |
          Workspace context for this turn, supplied by the Geneva adviser workspace (not typed by the user): {details}. The user is the bank's authorised adviser for this client, working inside the bank's own workspace, so referring to these details (name, risk category, IPS version) is expected and is not a privacy issue. Use them to tailor the answer; your audience is a professional adviser, not the end client. You do not have the client's IPS, holdings, meeting notes or portfolio data; if the question needs them, say so and suggest checking the client's documents in the workspace instead of guessing.

